[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cplf-llm"
version = "1.2.0"
description = "Reference implementation for CPLF-LLM"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
dependencies = {file = ["CPLF LLM protocols io complete package/CPLF LLM protocols io FORMAL RELEASE/requirements.txt"]}
