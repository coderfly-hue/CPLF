name: Formal release and canonical evidence checks
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lightweight validation dependencies
        run: python -m pip install --upgrade pip numpy pandas scikit-learn matplotlib==3.10.8
      - name: Check published files and statements
        run: |
          python scripts/verify_formal_release.py
          python scripts/verify_root_release_manifest.py
          python scripts/audit_published_cases.py
          python scripts/verify_canonical_release.py --root .
          python scripts/reproduce_tables.py --output-dir outputs/ci_tables
          python scripts/reproduce_figures.py --all --output-dir outputs/ci_figures
          python -m unittest discover -s tests -v
      - name: Report independent evidence availability (not a CI pass criterion)
        run: |
          if python scripts/verify_canonical_release.py --root . --strict; then
            echo "Primary canonical file-level evidence is available. Independent GPU reruns were not checked."
          else
            echo "::warning::The manuscript's original primary run evidence is not fully archived; see docs/RELEASE_READINESS_AND_SOURCE_EVIDENCE.md"
          fi
